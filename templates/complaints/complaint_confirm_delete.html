{% extends 'base.html' %}
{% block title %}Delete Complaint - CMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center py-5">
                <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                <h4>Delete Complaint?</h4>
                <p class="text-muted">Are you sure you want to delete <strong>{{ object.complaint_id }}</strong> – {{ object.title }}?</p>
                <p class="text-danger small">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2"><i class="fas fa-trash me-1"></i> Yes, Delete</button>
                    <a href="{% url 'complaint_detail' object.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
